name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend-sqlite:
    name: Backend tests (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  backend-mysql:
    name: Backend tests + Alembic (MySQL 8.4)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: utender_test
          MYSQL_USER: utender
          MYSQL_PASSWORD: utender
        ports:
          - "3307:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=3s --health-timeout=3s --health-retries=40
    env:
      DATABASE_URL: mysql+pymysql://utender:utender@127.0.0.1:3307/utender_test
      TEST_DATABASE_URL: mysql+pymysql://utender:utender@127.0.0.1:3307/utender_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Alembic - upgrade a clean database to head
        run: alembic upgrade head
      - name: Alembic - models and migrations agree
        run: alembic check
      # The harness drops everything and re-runs `alembic upgrade head` itself,
      # so the suite always runs against a freshly migrated schema.
      - name: Backend tests against MySQL
        run: pytest -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npm run build
