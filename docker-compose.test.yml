# Throwaway MySQL for the backend test suite and migration checks. Not used
# by the app itself (see docker-compose.yml for that). Runs on 3307 so it never
# collides with a dev database on 3306, and keeps its data in tmpfs.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   export TEST_DATABASE_URL=mysql+pymysql://utender:utender@127.0.0.1:3307/utender_test
#   (cd backend && pytest)
#   docker compose -f docker-compose.test.yml down
services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: utender_test
      MYSQL_USER: utender
      MYSQL_PASSWORD: utender
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      # -h 127.0.0.1 forces TCP: during first-boot init the server only listens
      # on a socket, so a socket ping would report healthy too early.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
